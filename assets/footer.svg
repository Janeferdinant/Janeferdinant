.place { font: 500 16px 'DM Sans M', sans-serif; fill: rgba(243,240,250,.78); }
.rise { animation: rise 1.1s cubic-bezier(.2,.7,.2,1) both; }
.d1 { animation-delay: .15s; } .d2 { animation-delay: .3s; } .d3 { animation-delay: .45s; } .d4 { animation-delay: .6s; }
