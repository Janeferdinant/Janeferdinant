@keyframes travel { 0% { offset-distance: 0%; opacity: 0; } 8% { opacity: 1; } 62% { opacity: 1; } 72% { offset-distance: 100%; opacity: 0; } 100% { offset-distance: 100%; opacity: 0; } }
.shimmer { animation: shimmer 7s ease-in-out infinite; }
@keyframes shimmer { 0%,100% { opacity: .55; } 45% { opacity: .85; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .light { opacity: 0; } }

